<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <title>Gerenciador de Músicas</title>

    <link rel="stylesheet" href="estilos.css">

</head>

<body>

    <div class="topo">

        <img src="12345.png">
        <h1>Gerenciador de Músicas</h1>

    </div>



<div class="principal">

    <div class="cadastro">
        <h2>＋ Cadastrar Música</h2>

        <p>
            Preencha os dados da música para adicioná-la à sua lista.
        </p>

        <button id="cadastrar">
            ＋ Cadastrar
        </button>
    </div>


    <div class="acoes">

        <h2>⚙ Ações</h2>

        <button id="listar">
            ☷ Listar
        </button>

        <button id="buscar">
            ⌕ Buscar
        </button>

        <button id="deletar">
            🗑 Deletar por ID
        </button>

        <button id="remover">
            🗑 Remover último
        </button>

        <button id="limpar">
            ✕ Limpar tudo
        </button>

    </div>


    <div class="lista">

        <h2>♫ Músicas cadastradas</h2>

        <p>
            Total de músicas:
            <span id="total">3</span>
        </p>

        <table id="tabela">

            <tr>
                <th>ID</th>
                <th>Música</th>
                <th>Artista</th>
                <th>Gênero</th>
                <th>Ano</th>
            </tr>

            <tr>
                <td>1</td>
                <td>November Rain</td>
                <td>Guns N' Roses</td>
                <td>Rock</td>
                <td>1922</td>
            </tr>

            <tr>
                <td>2</td>
                <td>Eu te devoro</td>
                <td>Djavan</td>
                <td>MPB</td>
                <td>1998</td>
            </tr>

            <tr>
                <td>3</td>
                <td>Coincidence</td>
                <td>Sabrina Carpenter</td>
                <td>Pop</td>
                <td>2024</td>
            </tr>

        </table>

    </div>

</div>

</body>
</html>
